name: Update UFC CSV data
on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * *'
permissions:
  contents: write
jobs:
  update-ufc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert UFC CSV datasets
        run: python scripts/build_ufc_csv.py
      - name: Publish validated UFC dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ufc-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update UFC research data"
            git push
          fi
