name: Update UFC research data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 2,6'
permissions:
  contents: write
concurrency:
  group: ufc-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Build static UFC dataset
        run: python scripts/build_ufc_data.py --max-fighters 60 --delay 0.8
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ufc-data.json
          git diff --cached --quiet || (git commit -m "Update UFC dataset" && git push)
