
name: Update UFC Fight Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build UFC fight cards
        run: python build_ufc_cards.py

      - name: Validate UFC card data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/ufc-cards.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          events = data.get("events", [])

          assert events, "No UFC events found"
          assert not any("error" in e for e in events), "Event fetch errors"
          assert any(e.get("fights") for e in events), "No fights extracted"

          allowed = {None, "main", "prelims", "early_prelims"}
          for event in events:
              for fight in event.get("fights", []):
                  assert fight.get("section") in allowed
                  assert fight.get("fighter1") and fight.get("fighter2")

          print(f"Validated {len(events)} events")
          PY

      - name: Publish UFC fight cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ufc-cards.json
          if ! git diff --cached --quiet; then
            git commit -m "Update UFC fight cards"
            git push
          fi
