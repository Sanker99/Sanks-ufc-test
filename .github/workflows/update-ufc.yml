
name: Test UFC CSV source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ufc-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check UFC dataset availability
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request

          base = "https://raw.githubusercontent.com/Greco1899/scrape_ufc_stats/main/"
          files = [
              "ufc_fighter_details.csv",
              "ufc_fight_results.csv",
              "ufc_fight_stats.csv",
              "ufc_event_details.csv"
          ]

          for filename in files:
              print(f"\nChecking {filename}", flush=True)
              request = urllib.request.Request(
                  base + filename,
                  headers={"User-Agent": "SanksResearchLab/1.0"}
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  sample = response.read(65536).decode("utf-8-sig")
                  print("HTTP status:", response.status)
                  reader = csv.reader(io.StringIO(sample))
                  print("Columns:", next(reader))
                  print("Sample record:", next(reader, [])[:8])
          PY
