
name: Update UFC Research Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

jobs:
  update-ufc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build UFC dataset
        run: python build_ufc_csv.py

      - name: Publish UFC dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ufc-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update UFC research data"
            git push
          fi
