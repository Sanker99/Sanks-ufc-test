name: Validate Command Center
on:
  pull_request:
    paths: ['command-center/**', '_worker.js', '_routes.json', 'package.json', '.github/workflows/command-center.yml']
  push:
    branches: [feature/sanks-command-center]
    paths: ['command-center/**', '_worker.js', '_routes.json', 'package.json', '.github/workflows/command-center.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate preview Worker and tracker for source consistency checks
        run: |
          node --input-type=module -e "import {bundleWorker} from './command-center/bundle.mjs'; import {writeFile,copyFile} from 'node:fs/promises'; await writeFile('_worker.js',await bundleWorker(process.cwd())); await copyFile('command-center/tracker.js','sanks-tracker.js');"
      - run: node --test command-center/tests/*.test.mjs
# Deliberately no deployment job; production authentication must be verified first.
