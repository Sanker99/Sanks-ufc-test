name: Demand tracker isolated preview
on:
  push:
    branches: [feature/parlay-demand-live-stats]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parlay-demand-preview
  cancel-in-progress: false
jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PARLAY_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      PARLAY_WORKER_ACCESS: ${{ secrets.PARLAY_CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing tracker and demand integration
        id: checks
        run: |
          node --test parlay/tests/*.test.mjs
          node --check parlay/app.mjs
          node tools/stage_demand_preview.mjs
          npx --yes wrangler@4.156.0 deploy --dry-run --config workers/parlay-demand/wrangler.jsonc
          npx --yes wrangler@4.156.0 pages functions build --outdir work/demand-functions
      - name: Publish private collector to the isolated Worker only
        id: collector
        continue-on-error: true
        if: env.PARLAY_WORKER_ACCESS == 'true' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4.156.0 deploy --config workers/parlay-demand/wrangler.jsonc
      - name: Keep an unavailable-backend preview usable if Worker access is denied
        if: steps.collector.outcome != 'success'
        run: node -e "const fs=require('fs');const p='wrangler.jsonc';const c=JSON.parse(fs.readFileSync(p));delete c.services;fs.writeFileSync(p,JSON.stringify(c,null,2));"
      - name: Create isolated Pages project if absent
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4.156.0 pages project list --json > work/pages-projects.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const projects=JSON.parse(fs.readFileSync('work/pages-projects.json','utf8'));
          for(const name of ['sanks-parlay-demand-preview','sanks-parlay-feed'])if(!projects.some(p=>(p.name??p['Project Name'])===name))execFileSync('npx',['--yes','wrangler@4.156.0','pages','project','create',name,'--production-branch=main'],{stdio:'inherit'});
          JS
      - name: Build and publish the dedicated shared NFL gateway
        if: steps.collector.outcome == 'success'
        run: |
          mkdir -p work/feed-site
          echo 'SANKS shared NFL statistics gateway' > work/feed-site/index.html
          npx --yes wrangler@4.156.0 pages functions build --outdir work/feed-worker --output-routes-path work/feed-site/_routes.json
          cp work/feed-worker/index.js work/feed-site/_worker.js
          node --check work/feed-site/_worker.js
          npx --yes wrangler@4.156.0 --cwd workers/parlay-gateway pages deploy --project-name=sanks-parlay-feed --branch=main
      - name: Publish new demand branch only
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4.156.0 pages deploy --project-name=sanks-parlay-demand-preview --branch=feature/parlay-demand-live-stats
      - name: Report activation status
        if: always()
        run: |
          echo "Collector deployment outcome: ${{ steps.collector.outcome }}. Live data still requires BBS_API_KEY and verified mappings." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve deployable artifacts
        if: always() && steps.checks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: parlay-demand-preview
          path: |
            work/demand-site
            work/demand-functions
