
name: Test UFC Card Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ufc-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run UFC card discovery
        run: python build_ufc_cards.py

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: ufc-card-discovery
          path: data/ufc-cards.json
          if-no-files-found: error
