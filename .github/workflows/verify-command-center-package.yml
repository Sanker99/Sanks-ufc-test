name: Verify Command Center integration package

on:
  workflow_dispatch:
  push:
    branches: [feature/sanks-command-center]
    paths:
      - 'command-center/**'
      - '.github/workflows/verify-command-center-package.yml'

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run security and integration tests
        run: node --test command-center/tests/*.test.mjs
      - name: Generate integration bundle in isolated directory
        run: |
          mkdir -p /tmp/sanks-admin-test-input
          printf '<!doctype html><title>SANKS integration smoke test</title><p>Public site preserved</p>' > /tmp/sanks-admin-test-input/index.html
          node command-center/build.mjs /tmp/sanks-admin-test-input /tmp/sanks-admin-test-output
          test -s /tmp/sanks-admin-test-output/_worker.js
          test -s /tmp/sanks-admin-test-output/_routes.json
          test -s /tmp/sanks-admin-test-output/index.html
          test -s /tmp/sanks-admin-test-output/sanks-tracker.js
          node --check /tmp/sanks-admin-test-output/_worker.js
          node --check /tmp/sanks-admin-test-output/sanks-tracker.js
      - name: Package isolated smoke test (never deployed)
        run: |
          cd /tmp/sanks-admin-test-output
          zip -qr "$GITHUB_WORKSPACE/command-center-smoke-test.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: command-center-isolated-smoke-test
          path: command-center-smoke-test.zip
          retention-days: 7
