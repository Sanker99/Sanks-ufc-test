name: Import verified 11-task TEST release
on:
  push:
    branches: [codex/11-task-improvements-2026-10-20]
    paths: [.github/workflows/import-batch-test.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test-lab-publish
  cancel-in-progress: false
jobs:
  import-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests beautifulsoup4
      - name: Download the approved draft packages through authenticated GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, requests, zipfile
          target=pathlib.Path('work/batch-import');target.mkdir(parents=True,exist_ok=True)
          api='https://api.github.com/repos/Sanker99/Sanks-ufc-test'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          response=requests.get(api+'/releases?per_page=100',headers=headers,timeout=60);response.raise_for_status()
          release=next(r for r in response.json() if r['draft'] and r['name']=='Verified 11-task TEST Lab transfer — 2026-10-20')
          assets={a['name']:a for a in release['assets']}
          packages={'development-batch-source.zip':'bb56d251aa519390ebccb291c2a016fc7279b38179a1f147b83615258f6643c0','SANKS-Research-Lab-11-TASK-TEST.zip':'69aee9a61fff7a5601534965592b5374b8adad9d5207cd12ace141cb0310f60e'}
          for name,expected in packages.items():
              url=assets[name]['url'];assert url.startswith(api+'/releases/assets/')
              with requests.get(url,headers={**headers,'Accept':'application/octet-stream'},stream=True,timeout=180) as r:
                  r.raise_for_status();digest=hashlib.sha256();archive=target/name
                  with archive.open('wb') as out:
                      for chunk in r.iter_content(1024*1024):out.write(chunk);digest.update(chunk)
              assert digest.hexdigest()==expected, 'Release hash mismatch: '+name
              with zipfile.ZipFile(archive) as z:
                  assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
                  if name=='development-batch-source.zip':
                      assert all(n.startswith('patches/') for n in z.namelist());z.extractall(target)
                  else:
                      for n in z.namelist():
                          if n.startswith('assets/photos/'):z.extract(n,'.')
              print('Verified approved package:',name)
          PY
      - name: Preserve individual task commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --3way work/batch-import/patches/*.patch
      - name: Restore the approved photo library and stage the test site
        run: python tools/stage_test_site.py
      - name: Run application and source checks
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Save approved assets on the development branch
        run: |
          git add assets/photos
          if ! git diff --cached --quiet; then git commit -m 'Preserve all 3350 approved athlete photos on test development branch'; fi
          git push origin HEAD:codex/11-task-improvements-2026-10-20
      - name: Deploy the verified test project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy work/site --project-name=sanksresearchlab-test --branch=main

