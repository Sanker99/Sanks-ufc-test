name: Deploy approved 19-link rotation (exact production bundle)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanks-production-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout release procedure
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout original approved source
        uses: actions/checkout@v4
        with:
          ref: 6d44d2c17df1df02265aeb3e128293b1bd12b1ba
          path: approved-base
          persist-credentials: false
      - name: Checkout tested rotation source
        uses: actions/checkout@v4
        with:
          ref: b52e2ed7786b9bbe0cf2a38f533b8448842c0790
          path: approved-update
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current production metadata (no secret output)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/check_rotation_account.py
      - name: Compare all known production paths with the current snapshot
        run: python tools/audit_rotation_baseline.py
      - name: Test approved rotation without opening destinations
        run: |
          node --test tests/rotation-release.test.cjs
          python -m unittest discover -s tests -p test_rotation_release.py
      - name: Stage the rotation while preserving current tracker bytes
        run: python tools/stage_approved_rotation_release.py
      - name: Require authenticated complete inventory and routing review
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/check_rotation_account.py --publish-gate
      - name: Publish exact verified bundle
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy work/site --project-name=sanksresearchlab --branch=main
      - name: Verify all released bytes; stop for rollback on mismatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/verify_rotation_live.py
      - name: Retain sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-release-evidence
          path: |
            work/rotation-audit/account-metadata.json
            work/rotation-audit/comparison.json
            work/rotation-audit/release.json
          retention-days: 30
            work/rotation-audit/live-verification.json
