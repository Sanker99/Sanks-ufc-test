name: Validate V5 dashboard
on:
  push:
    branches: [codex/sanks-v5-athlete-pages, codex/sanks-v6-cinematic-prototype]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
