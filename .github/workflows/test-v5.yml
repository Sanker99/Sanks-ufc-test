name: Validate V5 dashboard
on:
  push:
    branches: [codex/sanks-v5-athlete-pages]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore ignored approved helmet fixtures
        run: python3 command-center/tests/restore-helmets.py
      - run: node --test tests/*.test.cjs
