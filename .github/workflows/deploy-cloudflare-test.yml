name: Refresh and deploy TEST Lab
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-cloudflare-test.yml]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: test-lab-publish
  cancel-in-progress: false
jobs:
  update-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SANKS_TARGET_PROJECT: sanksresearchlab-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/11-task-improvements-2026-10-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests beautifulsoup4
      - uses: actions/cache@v4
        with:
          path: |
            cache
            work/ncaa-cache
            work/ufc-source
            work/weather
            work/nfl-intelligence-cache
            work/event-times-cache
          key: test-lab-cache-${{ runner.os }}-${{ hashFiles('data/athlete-photos.json') }}-${{ github.run_id }}
          restore-keys: test-lab-cache-${{ runner.os }}-${{ hashFiles('data/athlete-photos.json') }}-
      - name: Refresh free sources while retaining valid snapshots on failure
        run: python tools/update_test_data.py
      - name: Restore approved assets and stage test site
        run: python tools/stage_test_site.py
      - name: Verify application and source joins
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit source snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json data.json assets/flags
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified test Lab sports snapshots'
            git push origin HEAD:codex/11-task-improvements-2026-10-20
          fi
      - name: Deploy test project directly after refresh
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy work/site --project-name=sanksresearchlab-test --branch=main

