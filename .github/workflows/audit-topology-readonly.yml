name: Read-only Cloudflare topology audit
on:
  push:
    branches: [release/for-the-boys-19-safe-production]
    paths: [.github/workflows/audit-topology-readonly.yml]
permissions:
  contents: read
  actions: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Remove temporary broad diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,urllib.request,urllib.error
          req=urllib.request.Request('https://api.github.com/repos/Sanker99/Sanks-ufc-test/actions/artifacts/12864377045',method='DELETE',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  assert response.status==204
              print('Removed temporary diagnostic artifact')
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              print('Temporary diagnostic artifact already absent')
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read sanitized Pages topology
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/audit_cloudflare_topology.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-topology-readonly
          path: |
            work/topology-audit/topology.json
            work/topology-audit/production-inventory.json
          retention-days: 14

# Recheck API redaction without logging configuration values.
